[package]
name = "aion-stabilizer"
version = "1.1.1"
edition = "2021"
build = "build.rs"
description = "Simple tray-based Aion connection stabilizer for Windows (zapret/winws frontend)"
license = "MIT"
repository = "https://github.com/tbytez/simple-aion-stabilizer"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }
egui = "0.37"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
ureq = "3.5.2"
# 4.x line: mature stable API, extract-only (deflate covers our release zips)
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
