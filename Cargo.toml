[package]
name = "aion-stabilizer"
version = "0.1.9"
edition = "2021"
build = "build.rs"
description = "Simple tray-based Aion connection stabilizer for Windows (zapret/winws frontend)"
license = "MIT"
repository = "https://github.com/tbytez/simple-aion-stabilizer"

[workspace]
members = [".", "tools/sign-manifest"]
exclude = ["vendor/winit"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit"] }
egui = "0.37"
serde_json = "1.0.154"
sha2 = "0.11.1"
# update manifest signing/verification (pinned public key, fail closed)
ed25519-dalek = "3.0.0"
# 4.x line: mature stable API, extract-only (deflate covers our release zips)
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
ureq = "3.5.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Temporary backport of upstream winit#4341 to the stable 0.30 line.
# Remove when a compatible published release includes the native DPI fix.
[patch.crates-io]
winit = { path = "vendor/winit" }
